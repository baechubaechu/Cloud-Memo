# 허브 프로필 — Caddy·워커 없음, LAN/ Tailscale 접속용
#   docker compose -f deploy/hub/docker-compose.yml --env-file deploy/hub/.env up -d --build

services:
  memo-postgres:
    image: postgres:16-alpine
    container_name: memo-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memo}
      POSTGRES_DB: ${POSTGRES_DB:-memo}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memo} -d ${POSTGRES_DB:-memo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  memo-api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    container_name: memo-hub-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-memo}:${POSTGRES_PASSWORD:-memo}@memo-postgres:5432/${POSTGRES_DB:-memo}
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-dev-change-me}
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
      BACKUP_DIR: /data/backups
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
      INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL:-admin@localhost}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-1234}
      VERSION_AUTOSAVE_MIN_SECONDS: ${VERSION_AUTOSAVE_MIN_SECONDS:-120}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    volumes:
      - ${DATA_DIR:-./data}/uploads:/data/uploads
      - ${DATA_DIR:-./data}/exports:/data/exports
      - ${DATA_DIR:-./data}/backups:/data/backups
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      memo-postgres:
        condition: service_healthy

  memo-web:
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: memo-hub-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - memo-api
